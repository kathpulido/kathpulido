name: Widgets del perfil

# Genera las tarjetas como archivos dentro del repositorio.
# Así no dependen de servidores públicos que a veces se caen.
on:
  schedule:
    - cron: "0 8 * * *"        # todos los días, 08:00 UTC
  workflow_dispatch:            # botón «Run workflow» en la pestaña Actions
  push:
    branches: [main]
    paths:
      - ".github/workflows/widgets.yml"
      - ".github/widgets/**"

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tarjeta de estadísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: show_icons=true&include_all_commits=true&locale=es&hide_border=true&border_radius=14&bg_color=0E0B1F&title_color=C4B5FD&icon_color=E879F9&text_color=EDE9FE&ring_color=8B5CF6
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lenguajes más usados
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: layout=donut&langs_count=6&locale=es&hide_border=true&border_radius=14&bg_color=0E0B1F&title_color=C4B5FD&text_color=EDE9FE
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Racha de contribuciones
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&locale=es&hide_border=true&border_radius=14&background=0E0B1F&stroke=4C1D95&ring=E879F9&fire=FCD34D&currStreakNum=F5F3FF&sideNums=F5F3FF&currStreakLabel=E879F9&sideLabels=C4B5FD&dates=A78BFA
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribuciones en 3D
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/widgets/3d-violeta.json

      - name: Serpiente de contribuciones
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-dark.svg?palette=github-dark&color_snake=#E879F9&color_dots=#161b22,#2E1065,#5B21B6,#8B5CF6,#C4B5FD
            profile/snake-light.svg?color_snake=#A21CAF&color_dots=#ebedf0,#DDD6FE,#A78BFA,#7C3AED,#4C1D95

      - name: Perfil de actividad y logros
        run: python .github/widgets/widgets_propios.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USUARIO: ${{ github.repository_owner }}

      - name: Guardar los widgets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile profile-3d-contrib
          git commit -m "Actualiza los widgets del perfil" || exit 0
          git push
